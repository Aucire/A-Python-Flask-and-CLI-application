<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
       margin:0;
       box-sizing: border-box;
    }
    body{
        margin: 30px;
        background-color: #242424;
        background-image:
            linear-gradient(rgba(255, 253, 253, 0.05) 2px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 1px);
        background-size: 70px 70px;
    }
    
    h1,h2{
        text-align: center;
        color: white;
        font-weight: 800;
    }
    h1{
        font-size: 45px;
        color: orangered;
    }
    h2{
        font-size: 35px;
        color: orange;
    }
    input{
        color: black;
        font-size: 15px;
        font-weight: 600;
        margin: 10px auto;
        padding: 8px 3px;
        text-align: center;
        border-radius: 5px;
        outline: none;
    }
    ul, tr{
        color: whitesmoke;
        padding: 5px;
        font-size: 16px;
        font-weight: 600;
    }
    table{
        border: solid 2px gray;
        border-radius: 4px;      
        padding: 10px;  
        width: 700px;
        margin: 10px auto;
    }
    th{
        color: aqua;
        padding: 5px;
        font-size: 20px;
        font-weight: 800;
    }
    button{
        padding: 4px 7px;
        border: solid 2px red;
        color: red;
        border-radius: 5px;
    }
    div{
        text-align: center;
        padding: 10px;
    }
</style>
<body>
    <h1>|-------- INVENTORY  ----------|</h1>
    <div id="msg"></div>
    
    <h2>Add item</h2>
    <div>
        <input id="barcode" placeholder="Barcode"><br/>
        <input id="name" placeholder="...or product name"><br/>
        <input id="price" type="number" step="0.01" placeholder="Price"><br/>
        <input id="stock" type="number" placeholder="Stock"><br/>
        <button onclick="addItem()">Add</button>
    </div>


    <h2>Find on OpenFoodFacts</h2>
    <div>
        <input id="q" placeholder="Product name"><br/>
        <button onclick="search()">Search</button>
        <ul id="results"></ul>
    </div>


    <h2>Inventories</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
